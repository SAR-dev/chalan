# Dependabot (ROADMAP R1.7).
#
# `pg`, `postcss` and `typescript` are pinned without a `^`, and `next` was a
# couple of patches behind, so nothing in the tree moved on its own — every
# update was a manual edit that had to be remembered. Weekly PRs make that
# mechanical. Coverage reviews stay `ci.yml`'s job; this only opens the PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Batch patch/minor bumps so one PR exercises the whole gate instead of
      # one PR per dependency.
      production-minor:
        update-types:
          - minor
        dependency-type: production
      development-minor:
        update-types:
          - minor
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
