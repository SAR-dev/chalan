  #     # over any file anyway). Playwright's webServer inherits these and adds its
  #     # own (AUTH_RATE_LIMIT_DISABLED, TRUSTED_PROXY_HOPS, LOG_EMAIL_BODY); the
  #     # test workers read DATABASE_URL / CRON_SECRET directly.
  #     env:
  #       DATABASE_URL: postgres://postgres:postgres@localhost:5432/delivery
  #       BETTER_AUTH_SECRET: ci-better-auth-secret-000000000000
  #       CRON_SECRET: ci-cron-secret-0000000000000000000000
  #       NEXT_PUBLIC_SITE_URL: http://localhost:3000
  #       NEXT_PUBLIC_ENV: development
  #       STORAGE_PROVIDER: local
  #       LOCAL_UPLOADS_DIR: ./.uploads
  #       TZ: Asia/Dhaka
  #     steps:
  #       - uses: actions/checkout@v7
  #       - uses: pnpm/action-setup@v6
  #       - uses: actions/setup-node@v7
  #         with:
  #           node-version: 24
  #           cache: pnpm
  #       - run: pnpm install --frozen-lockfile
  #       # Schema first: the webServer seeds (pnpm db:seed:full) before it starts.
  #       - run: pnpm db:migrate
  #       - run: pnpm build
  #       - run: pnpm exec playwright install --with-deps chromium
  #       # Playwright boots its own server: `pnpm db:seed:full && pnpm start`.
  #       - run: pnpm test:e2e
  #       - uses: actions/upload-artifact@v7
  #         if: failure()
