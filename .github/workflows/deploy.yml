name: Deploy

# Gate production on CI: this workflow only runs after the CI workflow
# completes on `main`, and the job below skips unless CI succeeded
#. A red CI run can no longer reach production.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  # No IMAGE_NAME here: `github.repository` carries uppercase (`SAR-dev/chalan`)
  # and Docker tags reject that. The lowercase name is computed in the
  # "Compute the lowercase image name" step and read as `steps.image.outputs.name`.

jobs:
  deploy:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy the exact commit CI validated, not the branch tip.
          ref: ${{ github.event.workflow_run.head_sha }}

      # Switches buildx off the default `docker` driver, which cannot export a
      # cache. Without this the build step below dies on `cache-to: type=gha`
      # with "Cache export is not supported for the docker driver", before the
      # image is ever pushed.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Docker tags must be lowercase and `github.repository` is not
      # (`SAR-dev/chalan`), so pushing `ghcr.io/SAR-dev/chalan` fails with
      # "repository name must be lowercase". Normalise once here and use this
      # one string for the pushed tags and the VPS's APP_IMAGE, so the two can
      # never disagree about the name.
      - name: Compute the lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest,${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://chalan.sarn.top' }}
            NEXT_PUBLIC_ENV=${{ vars.NEXT_PUBLIC_ENV || 'production' }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/delivery-management

            # Which compose file this host deploys. Override on the VPS (e.g.
            # COMPOSE_FILE=docker/compose.monolith.yml) or in the deploy env.
            export COMPOSE_FILE="${COMPOSE_FILE:-docker/compose.cluster.yml}"

            # Pin the exact image built by this run (compose reads APP_IMAGE).
            # Same lowercase name the build pushed — one source, no `tr` guess.
            export APP_IMAGE=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}

            docker compose pull

            # 1. Infrastructure first — the database must be up before the
            #    backup and the migration run.
            docker compose up -d pg-0 pg-1 pgpool redis

            # 2. Pre-migration backup (custom-format dump). The container holds
            #    POSTGRESQL_USERNAME / POSTGRESQL_DATABASE. `set -e` aborts the
            #    deploy if the dump fails, so we never migrate unbacked.
            mkdir -p backups
            docker compose exec -T pg-0 sh -c \
              'pg_dump -U "$POSTGRESQL_USERNAME" -d "$POSTGRESQL_DATABASE" -Fc' \
              > "backups/pre-migrate-$(date +%Y%m%d-%H%M%S).dump"

            # 3. Apply versioned migrations. A failure here fails the job (no
            #    `||` fallback) and the app services are never rolled out.
            docker compose run --rm migrate

            # 4. Roll out the app now that the schema is current.
            docker compose up -d --remove-orphans

            docker image prune -f
