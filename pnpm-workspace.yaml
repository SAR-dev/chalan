allowBuilds:
  esbuild: true
  sharp: true

approvedBuilds:
  - esbuild
  - sharp

minimumReleaseAgeExclude:
  - browserslist@4.29.1
  - nodemailer@10.0.13

onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp

# Security overrides — transitive deps pinned past their advisory fixes
# (kept here because pnpm 11 no longer reads `pnpm.overrides` from package.json).
#
# Gate: `pnpm audit --audit-level=high` in CI — the WHOLE tree, prod and dev.
# Do not "fix" a red audit by switching it to `--prod`: that reports 0 high here
# and hides the dev tree entirely.
#
# `auditConfig.ignoreGhsas` is the escape hatch for advisories with NO published
# fix, so no override can help. Keep the list empty otherwise — each entry is a
# permanent hole in this gate, and a wide list means the gate is decorative.
# See "Dependency security" in CONTRIBUTING.md.
auditConfig:
  ignoreGhsas:
    # GHSA-vfj7-8cjw-p6xm — high, DoS in `braces` via deeply nested glob
    # patterns. The advisory says "patched >= 3.0.4" but 3.0.3 is still the
    # latest published release, and no newer `micromatch` (4.0.8) or
    # `fast-glob` (3.3.3) drops the dependency, so there is no version to move
    # to. It is reachable only through `shadcn`'s CLI (ts-morph/fast-glob ->
    # micromatch), which never runs in CI or `next build` — `shadcn` is a
    # devDependency only because `globals.css` imports `shadcn/tailwind.css`.
    # Remove this line as soon as braces 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm

overrides:
  brace-expansion@>=3.0.0: "^5.0.12"
  js-yaml: "^4.3.2"
  nanoid: "^3.3.19"
  browserslist: "^4.29.1"
  postcss: "^8.5.28"
  sharp: "^0.35.4"
  undici@>=7.0.0: "^7.29.1"
  fast-uri: "^3.1.8"
  ip-address: "^10.3.1"
