allowBuilds:
  esbuild: true
  sharp: true

approvedBuilds:
  - esbuild
  - sharp

minimumReleaseAgeExclude:
  - browserslist@4.29.1
  - nodemailer@10.0.13

onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp

# Security overrides — transitive deps pinned past their advisory fixes
# (kept here because pnpm 11 no longer reads `pnpm.overrides` from package.json).
# Gate: `pnpm audit --prod --audit-level=high` in CI (H1).
overrides:
  brace-expansion@>=3.0.0: "^5.0.12"
  js-yaml: "^4.3.2"
  nanoid: "^3.3.19"
  browserslist: "^4.29.1"
  postcss: "^8.5.28"
  sharp: "^0.35.4"
  undici@>=7.0.0: "^7.29.1"
  fast-uri: "^3.1.8"
  ip-address: "^10.3.1"
